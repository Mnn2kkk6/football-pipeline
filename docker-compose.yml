services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports: ["${PG_HOST_PORT:-15432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=512
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
  airflow:
    build: ./docker/airflow
    env_file: .env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow
    command: standalone
    ports: ["8080:8080"]
    depends_on: [postgres, s3]
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./dbt:/opt/airflow/dbt

  metabase:
    image: metabase/metabase:latest
    ports: ["3001:3000"]
    depends_on: [postgres]
    volumes: [metabasedata:/metabase-data]
    environment:
      MB_DB_FILE: /metabase-data/metabase.db

volumes:
  pgdata:
  s3data:
  metabasedata:
